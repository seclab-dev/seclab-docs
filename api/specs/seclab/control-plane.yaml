openapi: 3.1.0
info:
  title: SecLab Master API
  version: 0.1.0-alpha.1
  description: SecLab Master 控制面接口。首批条目迁移自现有人工文档，默认尚未与实现逐项核对。
servers:
  - url: /api/v1
tags:
  - name: 节点管理
  - name: Runtime
  - name: 认证
  - name: 审计
  - name: 通知
  - name: 系统管理
  - name: 应用管理
  - name: 桌面应用
  - name: 镜像管理
  - name: 在线升级
  - name: 脚本管理
  - name: 仿真场景
  - name: 套件中心
  - name: 任务调度
  - name: 运行时代理
paths:
  /nodes/list:
    get:
      operationId: seclabNodesList
      tags: [节点管理]
      summary: 查询节点列表
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: 返回节点列表, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
      x-seclab:
        owner: seclab
        layer: control-plane
        lifecycle: active
        implementationStatus: verified
        source: { repository: seclab, file: crates/seclab/src/api/nodes.rs }
        designDocs: []
        reviewedAt: "2026-06-27"
        notes: ''
  /nodes/create:
    post:
      operationId: seclabNodesCreate
      tags: [节点管理]
      summary: 创建新节点
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: 节点已创建, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
      x-seclab:
        owner: seclab
        layer: control-plane
        lifecycle: active
        implementationStatus: verified
        source: { repository: seclab, file: crates/seclab/src/api/nodes.rs }
        designDocs: []
        reviewedAt: "2026-06-27"
        notes: ''
  /nodes/precheck:
    post:
      operationId: seclabNodesPrecheck
      tags: [节点管理]
      summary: 新节点部署预检
      description: 对待新增节点执行 SSH、权限、systemd、目录、端口、Docker、已有 Agent 与版本兼容预检。
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodePrecheckRequest' }
      responses:
        '200': { description: 返回节点预检结果, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
      x-seclab:
        owner: seclab
        layer: control-plane
        lifecycle: active
        implementationStatus: unverified
        source: { repository: seclab, file: crates/seclab/src/api/nodes.rs }
        designDocs: [architecture/SecLab分布式部署与节点管理路线图.md]
        reviewedAt: null
        notes: 需要核对 NodePrecheckResponse 的完整字段。
  /nodes/deploy:
    post:
      operationId: seclabNodesCreateAndDeploy
      tags: [节点管理]
      summary: 创建并部署节点
      description: 服务端在创建库存记录前重新执行严格预检，预检失败时不创建节点记录。
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodePrecheckRequest' }
      responses:
        '200': { description: 节点部署任务已创建, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
      x-seclab:
        owner: seclab
        layer: control-plane
        lifecycle: active
        implementationStatus: unverified
        source: { repository: seclab, file: crates/seclab/src/api/nodes.rs }
        designDocs: [architecture/SecLab分布式部署与节点管理路线图.md]
        reviewedAt: null
        notes: 请求结构暂按旧文档中的预检字段登记。
  /node/{node_id}/detail:
    get:
      operationId: seclabNodeDetail
      tags: [节点管理]
      summary: 查询单个节点详情
      security: [{ cookieAuth: [] }]
      parameters:
        - name: node_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 返回节点详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
      x-seclab:
        owner: seclab
        layer: control-plane
        lifecycle: active
        implementationStatus: verified
        source: { repository: seclab, file: crates/seclab/src/api/nodes.rs }
        designDocs: []
        reviewedAt: "2026-06-27"
        notes: ''
  /node/{node_id}/update:
    put:
      operationId: seclabNodeUpdate
      tags: [节点管理]
      summary: 更新节点配置
      security: [{ cookieAuth: [] }]
      parameters:
        - name: node_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: 更新成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
