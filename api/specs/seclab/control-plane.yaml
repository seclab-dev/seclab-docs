      security: [{ cookieAuth: [] }]
      parameters:
        - name: node_id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
      responses:
        '200': { description: 返回历史观测数据, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
      x-seclab:
        owner: seclab
        layer: control-plane
        lifecycle: active
        implementationStatus: verified
